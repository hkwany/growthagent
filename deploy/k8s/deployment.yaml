apiVersion: apps/v1
kind: Deployment
metadata:
  name: growthagent
  labels:
    app: growthagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: growthagent
  template:
    metadata:
      labels:
        app: growthagent
    spec:
      containers:
        - name: growthagent
          image: growthagent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LLM_PROVIDER
              value: "ollama"
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: MAX_STEPS
              value: "8"
            - name: TOKEN_BUDGET
              value: "8000"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
